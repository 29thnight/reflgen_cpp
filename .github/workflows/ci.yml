# 저장소의 시험을 로컬과 같은 방법으로 돌린다.
#   cpp          컴파일러 × 표준 행렬(scripts/test.ps1) — 라이브러리, 생성기, 생성 코드, MSBuild 연동
#   vs-extension VS 확장의 C# 시험과 VSIX 빌드(산출물로 올린다)
#   package      배포물(zip·NuGet)을 만들어 올리고, vcpkg port 를 이 커밋에서 실제로 설치해 본다
# 로컬 검증 환경(VS 18, MSVC 19.5x)과 맞추려고 VS 2026 이미지를 고정한다.
name: ci

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prsm-abi-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify independent production ABI vectors
        shell: pwsh
        run: ./scripts/generate-prsm-abi-vectors.ps1
      - name: Verify Rust consumer encoder and SHA-256
        run: cargo test --locked --manifest-path generator/tests/prsm_abi_rust/Cargo.toml --target-dir build/prsm-abi-rust

  cpp:
    name: cpp (${{ matrix.preset }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        preset: [msvc-cpp20, msvc-cpp23, clang-cl-cpp20, clang-cl-cpp23]
    steps:
      - uses: actions/checkout@v7
      # Compile and execute both generated C# and F# consumers against native libraries.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Configure, build and test
        shell: pwsh
        run: ./scripts/test.ps1 -Presets ${{ matrix.preset }}

  ifc:
    name: ifc (${{ matrix.configuration }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: Build and execute the complete IFC reflection tests
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          $build = "build/ifc-${{ matrix.configuration }}"
          cmake -S . -B $build -G Ninja -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DREFLGEN_BUILD_IFC=ON -DREFLGEN_BUILD_TESTS=ON -DREFLGEN_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --target reflgen_cli reflgen_ifc_test reflgen_ifc_attributes_test reflgen_ifc_engine_test reflgen_ifc_crtp_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $registered = (ctest --test-dir $build --show-only=json-v1 | ConvertFrom-Json).tests.name
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in 'runtime', 'generator', 'rejections', 'mixed', 'msbuild', 'attributes', 'metadata', 'engine', 'engine_msbuild', 'crtp_runtime', 'module_interface', 'crtp_imported_rejected', 'crtp_adversary', 'crtp_nonmatching_fails_closed') {
            if ($registered -notcontains "reflgen_ifc_$name") { throw "Required IFC test was not registered: $name" }
          }
          ctest --test-dir $build -R '^reflgen_ifc_' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve IFC test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ifc-${{ matrix.configuration }}-diagnostics
          path: |
            build/ifc-${{ matrix.configuration }}/Testing/Temporary/
            build/ifc-${{ matrix.configuration }}/tests/ifc/
          if-no-files-found: ignore

  prsm-ifc:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - name: Build both frontends and execute generated PrSM bridges
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          cmake --preset msvc-cpp20 -DREFLGEN_BUILD_IFC=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset msvc-cpp20 --target reflgen_cli reflgen_ifc reflgen_binding_contract_tests reflgen_generator_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset msvc-cpp20 -R '^reflgen_(binding_contract_tests|generator_tests|prsm_bridge)$'

  vs-extension:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Core tests
        shell: pwsh
        run: dotnet test vs/tests/Reflgen.VisualStudio.Core.Tests --nologo
      - name: Build the VSIX
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          & $msbuild vs/src/Reflgen.VisualStudio/Reflgen.VisualStudio.csproj /restore /p:Configuration=Release /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: Reflgen.VisualStudio.vsix
          path: vs/src/Reflgen.VisualStudio/bin/Release/net472/Reflgen.VisualStudio.vsix
          if-no-files-found: error

  package:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # vcpkg_from_git 이 이 저장소에서 커밋을 가져온다
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build the release artifacts
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Consume the NuGet package from a project without reflgen settings
        shell: pwsh
        run: ./tests/package/check_nuget_consumer.ps1
      - name: Consume installed IFC tools and named modules in a mixed project
        shell: pwsh
        run: ./tests/package/check_module_consumer.ps1 -Prefix "$PWD/build/package/stage" -Work "$env:RUNNER_TEMP/reflgen-module-consumer"
      - uses: actions/upload-artifact@v7
        with:
          name: reflgen-packages
          path: |
            build/package/*.zip
            build/package/*.nupkg
          if-no-files-found: error
      - name: Install the vcpkg port from this commit
        shell: pwsh
        run: |
          $overlay = Join-Path $env:RUNNER_TEMP 'overlay-ports'
          ./scripts/make-overlay-port.ps1 -Destination $overlay -Local
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install reflgen --overlay-ports=$overlay --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows'
          foreach ($path in 'tools\reflgen\reflgen.exe', 'tools\reflgen\reflgen-ifc.exe', 'tools\reflgen\libclang.dll',
                            'tools\reflgen\clang\include\stddef.h', 'include\reflgen\reflgen.h',
                            'share\reflgen\msbuild\reflgen.targets', 'share\reflgen\modules\reflgen.json.ixx',
                            'share\reflgen\reflgen-standard.cmake', 'share\reflgen\reflgen-config.cmake') {
            if (-not (Test-Path (Join-Path $installed $path))) { throw "the vcpkg port did not install $path" }
          }
          & (Join-Path $installed 'tools\reflgen\reflgen.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release-bundle:
    name: Verified release bundle
    needs: [cpp, ifc, prsm-abi-contract, prsm-ifc, vs-extension, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: reflgen-packages
          path: build/release-bundle
      - uses: actions/download-artifact@v7
        with:
          name: Reflgen.VisualStudio.vsix
          path: build/release-bundle
      - name: Verify package identity and prepare release notes and checksums
        run: >-
          python3 scripts/prepare-release.py
          --artifacts build/release-bundle
          --source .
          --commit "${{ github.sha }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@v7
        with:
          name: reflgen-release
          path: build/release-bundle/*
          if-no-files-found: error
